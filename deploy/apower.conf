limit_req_zone $binary_remote_addr zone=apower_login:10m rate=10r/m;
server {
    listen 80;
    server_name 177.5.75.237;
    root /var/www/apower-acme;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 308 https://177.5.75.237$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name 177.5.75.237;
    ssl_certificate /etc/letsencrypt/live/apower-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apower-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 9m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    access_log /var/log/nginx/apower-access.log;
    error_log /var/log/nginx/apower-error.log;

    location /api/cms/login {
        limit_req zone=apower_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
