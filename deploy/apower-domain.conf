# Phase 2 template. DO NOT enable until apower-domain has a valid certificate
# for BOTH names, and the app build + APOWER_PUBLIC_ORIGIN use the main domain.
# Keep deploy/apower.conf for IP HTTPS; its apower_login zone is shared here.
server {
    listen 80;
    server_name apowertech.net www.apowertech.net;
    if ($host !~ ^(apowertech\.net|www\.apowertech\.net)$) { return 444; }
    server_tokens off;
    root /var/www/apower-acme;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 308 https://apowertech.net$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name www.apowertech.net;
    if ($host != "www.apowertech.net") { return 444; }
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/apower-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apower-domain/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://apowertech.net$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name apowertech.net;
    if ($host != "apowertech.net") { return 444; }
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/apower-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apower-domain/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 9m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    access_log /var/log/nginx/apower-domain-access.log;
    error_log /var/log/nginx/apower-domain-error.log;
    location /api/cms/login {
        limit_req zone=apower_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
