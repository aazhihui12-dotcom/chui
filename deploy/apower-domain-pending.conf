# Phase 1 only: safe to load before DNS changes or a domain certificate exists.
server {
    listen 80;
    server_name apowertech.net www.apowertech.net;
    if ($host !~ ^(apowertech\.net|www\.apowertech\.net)$) { return 444; }
    server_tokens off;
    root /var/www/apower-acme;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    # Do not expose an HTTP login or present the IP certificate for a domain.
    location / { return 302 https://177.5.75.237$request_uri; }
}
